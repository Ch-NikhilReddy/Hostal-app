# nginx config for the owner/admin dashboard.
#
# The dashboard's Content-Security-Policy has to be set HERE, by whatever serves the
# built files, because the API does not serve this origin and therefore cannot set a
# policy for it. A <meta> CSP in index.html is weaker (it cannot express
# frame-ancestors, and it does not apply to resources loaded before the tag is
# parsed), so this is the real one.
#
# Assumes `npm run build --workspace @hostelmitra/web` has written web/dist/.
# Free tier: one static site plus the API container. No CDN required.

server {
  listen 80;
  server_name _;

  root /var/www/hostelmitra;
  index index.html;

  # ---- Content-Security-Policy -------------------------------------------
  #
  # Fitted to what a Vite + React dashboard actually loads. Each directive is
  # there for a reason; do not loosen one without knowing what it was stopping.
  #
  #   script-src 'self'      the built bundle is a file. No inline script, no eval,
  #                          no CDN. This is the directive that actually prevents an
  #                          injected <script> from running, and it is the reason
  #                          web tokens in localStorage are defensible (M-10).
  #   style-src 'self' 'unsafe-inline'
  #                          React inline styles and any style attribute need it.
  #                          Styles are not a script-execution vector, so the cost is
  #                          low; the reward of removing it is a dashboard that renders.
  #   img-src 'self' data: https:
  #                          https: because hostel photos are remote URLs held in the
  #                          database. Narrow it to the image host if that becomes
  #                          one provider.
  #   connect-src 'self'    the API. In a split-origin deployment this must also list
  #                          the API origin — see note below. Listing an origin here
  #                          is the single most important line to get right when
  #                          going live: too tight and the dashboard cannot load data,
  #                          too loose and an injected script can exfiltrate it.
  #   font-src 'self' data:
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # ---- Other security headers -------------------------------------------
  # frame-ancestors above is the modern control; X-Frame-Options is the fallback for
  # older browsers and is kept deliberately.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

  # HSTS. Only safe once TLS is actually terminating here — sending it over plain
  # HTTP is meaningless, and enabling it before HTTPS works can lock a browser out
  # of the site for its own max-age. Uncomment only alongside a real certificate.
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ---- Caching -----------------------------------------------------------
  # Vite emits content-hashed filenames, so built assets can be cached hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html must NOT be cached, or a deploy leaves browsers loading a stale
  # document that references asset filenames which no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Single-page app: unknown paths are client-side routes, not 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never serve the environment file, source, or backups even if they end up in the
  # web root by accident.
  location ~ /\.(env|git) {
    deny all;
  }
  location ~* \.(ts|tsx|sql|log)$ {
    deny all;
  }
}

# TLS, when there is a certificate.
#
#   certbot --nginx -d dashboard.example.com
#
# Then uncomment the HSTS header above. The order matters: HTTPS working first,
# HSTS second.